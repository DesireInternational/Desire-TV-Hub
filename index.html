<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desire TV Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07070d; --surf:#111118; --card:#181824; --border:#252535;
  --accent:#c0392b; --accent2:#e67e22; --glow:rgba(192,57,43,.35);
  --text:#eeeef5; --muted:#66667a; --live:#2ecc71;
  --bn:'Hind Siliguri',sans-serif; --en:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--bn);display:flex;flex-direction:column;}

/* ── LOADING ── */
#ls{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
.ls-logo{display:flex;align-items:center;gap:14px;}
.ls-bar{width:220px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
.ls-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s;}
.ls-msg{font-size:13px;color:var(--muted);}

/* ── HEADER (fixed strip) ── */
header{
  height:52px;flex-shrink:0;
  background:rgba(7,7,13,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:50;
}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo svg{flex-shrink:0;}
.logo-name{font-family:var(--en);font-size:17px;font-weight:800;letter-spacing:-.4px;
  background:linear-gradient(90deg,#e74c3c,#e67e22);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:10px;color:var(--muted);font-family:var(--en);letter-spacing:.5px;text-transform:uppercase;line-height:1;}
.live-pill{display:flex;align-items:center;gap:5px;border:1px solid rgba(46,204,113,.3);
  border-radius:20px;padding:3px 10px;font-size:11px;color:var(--live);font-family:var(--en);}
.pulse{width:6px;height:6px;background:var(--live);border-radius:50%;animation:pls 1.4s infinite;}
@keyframes pls{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.4);}}

/* ── BODY LAYOUT: sidebar + main ── */
.app{flex:1;display:flex;overflow:hidden;}

/* ── SIDEBAR (channel list) ── */
.sidebar{
  width:280px;flex-shrink:0;
  display:flex;flex-direction:column;
  background:var(--surf);border-right:1px solid var(--border);
}
.sidebar-top{flex-shrink:0;padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.search-wrap{position:relative;}
.search-wrap input{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px 8px 34px;color:var(--text);font-size:13px;font-family:var(--bn);outline:none;
  transition:border-color .2s;
}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--muted);}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.cats::-webkit-scrollbar{height:2px;}
.cats::-webkit-scrollbar-thumb{background:var(--border);}
.cat{background:transparent;border:1px solid var(--border);border-radius:14px;
  padding:3px 10px;color:var(--muted);font-size:11px;font-family:var(--bn);cursor:pointer;
  transition:all .18s;white-space:nowrap;flex-shrink:0;}
.cat:hover{border-color:var(--accent);color:var(--accent);}
.cat.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.list-head{flex-shrink:0;padding:8px 12px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.list-head span:last-child{font-family:var(--en);font-weight:600;color:var(--text);}
.ch-scroll{flex:1;overflow-y:auto;}
.ch-scroll::-webkit-scrollbar{width:3px;}
.ch-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.chi{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;
  border-bottom:1px solid rgba(37,37,53,.5);transition:background .12s;}
.chi:hover{background:var(--card);}
.chi.on{background:rgba(192,57,43,.14);border-left:2px solid var(--accent);}
.ch-av{width:36px;height:36px;border-radius:7px;background:var(--card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;overflow:hidden;}
.ch-av img{width:100%;height:100%;object-fit:contain;}
.ch-txt{flex:1;min-width:0;}
.ch-n{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-s{font-size:10px;color:var(--muted);font-family:var(--en);}
.ch-qbadge{font-size:9px;background:var(--card);border:1px solid var(--border);
  border-radius:4px;padding:1px 5px;color:var(--muted);font-family:var(--en);white-space:nowrap;flex-shrink:0;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--live);flex-shrink:0;}

/* ── MAIN: player 1/3 fixed top, info below ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}

/* player = 1/3 of viewport height */
.player-wrap{
  height:calc((100vh - 52px) / 3);
  flex-shrink:0;position:relative;background:#000;
  display:flex;align-items:center;justify-content:center;
}
video{width:100%;height:100%;object-fit:contain;display:none;}

.empty-state{text-align:center;}
.empty-state .eico{font-size:48px;opacity:.15;margin-bottom:10px;}
.empty-state p{font-size:13px;color:var(--muted);}

.ov{position:absolute;inset:0;background:rgba(0,0,0,.8);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.ov.show{display:flex;}
.spin{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:sp .75s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.ov-msg{font-size:12px;color:var(--muted);}
.ov-src{font-size:10px;color:var(--accent);font-family:var(--en);}

/* quality badge overlay */
.q-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.15);border-radius:4px;
  padding:2px 7px;font-size:10px;color:#fff;font-family:var(--en);display:none;}

/* info bar below player */
.info-bar{
  flex-shrink:0;padding:10px 16px;
  background:var(--surf);border-bottom:1px solid var(--border);
  display:none;align-items:center;gap:12px;
}
.ib-logo{width:42px;height:42px;border-radius:8px;background:var(--card);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:18px;overflow:hidden;flex-shrink:0;}
.ib-logo img{width:100%;height:100%;object-fit:contain;}
.ib-name{font-size:15px;font-weight:600;}
.ib-meta{font-size:11px;color:var(--muted);font-family:var(--en);margin-top:2px;}
.ib-streams{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}
.sq-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:3px 8px;font-size:10px;color:var(--muted);font-family:var(--en);cursor:pointer;
  transition:all .15s;}
.sq-btn:hover{border-color:var(--accent);color:var(--accent);}
.sq-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* desc / scroll area */
.scroll-area{flex:1;overflow-y:auto;padding:14px 16px;}
.scroll-area::-webkit-scrollbar{width:3px;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border);}
.ch-detail{display:none;}
.ch-detail.show{display:block;}
.cd-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.cd-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.badge{font-size:10px;border:1px solid var(--border);border-radius:4px;padding:2px 7px;
  color:var(--muted);font-family:var(--en);}
.cd-streams-title{font-size:11px;color:var(--muted);margin-bottom:8px;font-family:var(--en);}
.streams-grid{display:flex;flex-direction:column;gap:6px;}
.stream-row{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;}
.stream-row:hover{border-color:var(--accent);}
.stream-row.playing{border-color:var(--accent);background:rgba(192,57,43,.1);}
.sr-q{font-size:11px;font-family:var(--en);font-weight:600;color:var(--text);min-width:45px;}
.sr-url{font-size:10px;color:var(--muted);font-family:var(--en);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sr-status{font-size:9px;padding:2px 6px;border-radius:3px;font-family:var(--en);flex-shrink:0;}
.sr-status.ok{background:rgba(46,204,113,.15);color:var(--live);}
.sr-status.fail{background:rgba(192,57,43,.15);color:#e74c3c;}
.sr-status.try{background:rgba(230,126,34,.15);color:var(--accent2);}

.placeholder-msg{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
.placeholder-msg .pi{font-size:40px;margin-bottom:12px;opacity:.2;}

/* ── LOGO SVG ── */
/* defined inline below */
</style>
</head>

<!-- LOADING -->
<div id="ls">
  <div class="ls-logo">
    <!-- inline logo -->

<div class="app">

    <!-- PLAYER (fixed 1/3 height) -->
    <div class="player-wrap" id="pw">
      <div class="empty-state" id="es">
        <div class="eico">📡</div>

        <div class="cd-streams-title">উপলব্ধ স্ট্রিম — অটোমেটিক সেরাটি বেছে নেবে</div>
        <div class="streams-grid" id="sg"></div>
      </div>
      <div class="placeholder-msg" id="pm">
        <div class="pi">🌐</div>
        <div>একটি চ্যানেল বেছে নিলে এখানে বিস্তারিত দেখাবে</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script>
// ═══════════════════ CONFIG ═══════════════════
const BASE = 'https://raw.githubusercontent.com/iptv-org/iptv/gh-pages/countries/';
const SOURCES = [
  {l:'বাংলাদেশ',c:'bd',f:'🇧🇩'},{l:'ভারত',c:'in',f:'🇮🇳'},
  {l:'পাকিস্তান',c:'pk',f:'🇵🇰'},{l:'সৌদি আরব',c:'sa',f:'🇸🇦'},
  {l:'UAE',c:'ae',f:'🇦🇪'},{l:'তুরস্ক',c:'tr',f:'🇹🇷'},
  {l:'যুক্তরাষ্ট্র',c:'us',f:'🇺🇸'},{l:'যুক্তরাজ্য',c:'gb',f:'🇬🇧'},
  {l:'কানাডা',c:'ca',f:'🇨🇦'},{l:'ফ্রান্স',c:'fr',f:'🇫🇷'},
  {l:'জার্মানি',c:'de',f:'🇩🇪'},{l:'রাশিয়া',c:'ru',f:'🇷🇺'},
  {l:'কাতার',c:'qa',f:'🇶🇦'},{l:'মালয়েশিয়া',c:'my',f:'🇲🇾'},
];

// quality order preference (best first)
const Q_ORDER = ['4k','2160p','1080p','720p','576p','480p','360p','240p',''];

// ═══════════════════ PARSE ═══════════════════
function parseM3U(txt, srcLabel, flag) {
  const lines = txt.split('\n'), out = [];
  let cur = {};
  for (const raw of lines) {
    const line = raw.trim();
    if (line.startsWith('#EXTINF')) {
      cur = {src: srcLabel, flag};
      const nm = line.match(/,(.+)$/);       if (nm) cur.name = nm[1].trim();
      const lo = line.match(/tvg-logo="([^"]+)"/); if (lo) cur.logo = lo[1];
      const gr = line.match(/group-title="([^"]+)"/); if (gr) cur.group = gr[1];
      const id = line.match(/tvg-id="([^"]+)"/);   if (id) cur.tvgId = id[1];
    } else if (line && !line.startsWith('#') && cur.name) {
      cur.url = line; out.push({...cur}); cur = {};
    }
  }
  return out;
}

// Extract quality from name, e.g. "NTV (1080p)" → "1080p"
function extractQuality(name) {
  const m = name.match(/\(([^)]+)\)\s*$/);
  return m ? m[1].toLowerCase() : '';
}

// Strip quality suffix from name
function baseName(name) {
  return name.replace(/\s*\([^)]+\)\s*$/, '').trim();
}

// ═══════════════════ GROUP CHANNELS ═══════════════════
// Group streams by (src + baseId): same channel, multiple qualities
function groupChannels(raw) {
  const map = new Map();
  for (const ch of raw) {
    // key: source + base name (lowercased, no quality suffix)
    const key = ch.src + '||' + baseName(ch.name).toLowerCase();
    if (!map.has(key)) {
      map.set(key, {
        name: baseName(ch.name),
        logo: ch.logo,
        src: ch.src,
        flag: ch.flag,
        group: ch.group,
        tvgId: ch.tvgId,
        streams: []
      });
    }
    const entry = map.get(key);
    const q = extractQuality(ch.name);
    entry.streams.push({ url: ch.url, quality: q, status: 'unknown' });
    // prefer best logo (first non-empty)
    if (!entry.logo && ch.logo) entry.logo = ch.logo;
  }

  // Sort streams: best quality first
  for (const [,ch] of map) {
    ch.streams.sort((a,b) => {
      const ai = Q_ORDER.indexOf(a.quality), bi = Q_ORDER.indexOf(b.quality);
      const av = ai === -1 ? 99 : ai, bv = bi === -1 ? 99 : bi;
      return av - bv;
    });
  }
  return [...map.values()];
}

// ═══════════════════ STATE ═══════════════════
let allCh = [], filtered = [], activeCat = 'সব';
let currentCh = null, currentStreamIdx = 0;
let hlsInst = null;
let failTimer = null;

// ═══════════════════ FETCH ═══════════════════
async function fetchSrc(s) {
  try {
    const r = await fetch(BASE + s.c + '.m3u');
    if (!r.ok) throw new Error(r.status);
    return parseM3U(await r.text(), s.l, s.f);
  } catch(e) { console.warn('Failed:', s.l, e.message); return []; }
}

async function loadAll() {
  const lf = document.getElementById('lf'), lm = document.getElementById('lm');
  const raw = [];
  for (let i = 0; i < SOURCES.length; i++) {
    const s = SOURCES[i];
    lm.textContent = s.f + ' ' + s.l + ' লোড হচ্ছে...';
    lf.style.width = ((i / SOURCES.length) * 92) + '%';
    raw.push(...await fetchSrc(s));
  }
  lf.style.width = '100%';
  allCh = groupChannels(raw);
  lm.textContent = allCh.length + ' টি চ্যানেল প্রস্তুত!';
  await new Promise(r => setTimeout(r, 600));
  document.getElementById('ls').style.display = 'none';
  initUI();
}

// ═══════════════════ UI INIT ═══════════════════
function initUI() {
  // Categories
  const cats = document.getElementById('cats');
  ['সব', ...SOURCES.map(s => s.l)].forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat' + (c === 'সব' ? ' on' : '');
    b.textContent = c;
    b.onclick = () => {
      activeCat = c;
      document.querySelectorAll('.cat').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      applyFilter();
    };
    cats.appendChild(b);
  });
  document.getElementById('si').addEventListener('input', applyFilter);
  filtered = [...allCh];
  render();
}

function applyFilter() {
  const q = document.getElementById('si').value.toLowerCase().trim();
  filtered = allCh.filter(ch => {
    const catOk = activeCat === 'সব' || ch.src === activeCat;
    const qOk = !q || ch.name.toLowerCase().includes(q) || (ch.group||'').toLowerCase().includes(q);
    return catOk && qOk;
  });
  render();
}

function render() {
  const c = document.getElementById('chc');
  document.getElementById('sc').textContent = filtered.length + ' টি';
  c.innerHTML = '';
  if (!filtered.length) {
    c.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px;">কোনো চ্যানেল নেই</div>';
    return;
  }
  const show = filtered.slice(0, 600), frag = document.createDocumentFragment();
  show.forEach((ch, i) => {
    const el = document.createElement('div');
    el.className = 'chi';
    el.dataset.i = i;
    const bestQ = ch.streams[0]?.quality || '';
    el.innerHTML = `
      <div class="ch-av">${ch.logo ? `<img src="${ch.logo}" loading="lazy" onerror="this.parentElement.innerHTML='${ch.flag}'">` : ch.flag}</div>
      <div class="ch-txt">
        <div class="ch-n">${ch.name}</div>
        <div class="ch-s">${ch.src}${ch.group ? ' · ' + ch.group : ''}</div>
      </div>
      ${bestQ ? `<div class="ch-qbadge">${bestQ}</div>` : ''}
      <div class="dot"></div>`;
    el.onclick = () => selectChannel(i, el);
    frag.appendChild(el);
  });
  c.appendChild(frag);
  if (filtered.length > 600) {
    const n = document.createElement('div');
    n.style.cssText = 'padding:8px;text-align:center;color:var(--muted);font-size:11px;';
    n.textContent = `+ ${filtered.length - 600} টি আরো — সার্চ করুন`;
    c.appendChild(n);
  }
}

// ═══════════════════ SELECT & PLAY ═══════════════════
function selectChannel(idx, el) {
  document.querySelectorAll('.chi.on').forEach(x => x.classList.remove('on'));
  if (el) el.classList.add('on');

  currentCh = filtered[idx];
  currentStreamIdx = 0;
  updateDetail();
  playStream(0);
}

function updateDetail() {
  const ch = currentCh;
  document.getElementById('es').style.display = 'none';
  document.getElementById('pm').style.display = 'none';
  document.getElementById('ib').style.display = 'flex';
  document.getElementById('cd').classList.add('show');

  // info bar
  const ibl = document.getElementById('ibl');
  ibl.innerHTML = ch.logo ? `<img src="${ch.logo}" onerror="this.parentElement.innerHTML='📺'" style="width:100%;height:100%;object-fit:contain">` : ch.flag;
  document.getElementById('ibn').textContent = ch.name;
  document.getElementById('ibm').textContent = ch.src + (ch.group ? ' · ' + ch.group : '') + ' · ' + ch.streams.length + ' স্ট্রিম';

  // detail
  document.getElementById('cdt').textContent = ch.name;

  const badges = document.getElementById('cdb');
  badges.innerHTML = '';
  if (ch.group) { const b = document.createElement('span'); b.className='badge'; b.textContent=ch.group; badges.appendChild(b); }
  { const b = document.createElement('span'); b.className='badge'; b.textContent=ch.src; badges.appendChild(b); }
  { const b = document.createElement('span'); b.className='badge'; b.textContent=ch.streams.length+' স্ট্রিম'; badges.appendChild(b); }

  // stream grid
  const sg = document.getElementById('sg');
  sg.innerHTML = '';
  ch.streams.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'stream-row' + (i === currentStreamIdx ? ' playing' : '');
    row.id = 'sr-'+i;
    const statusTxt = s.status === 'ok' ? 'সক্রিয়' : s.status === 'fail' ? 'ব্যর্থ' : 'অজানা';
    const statusCls = s.status === 'ok' ? 'ok' : s.status === 'fail' ? 'fail' : 'try';
    row.innerHTML = `
      <div class="sr-q">${s.quality || 'default'}</div>
      <div class="sr-url">${s.url}</div>
      <div class="sr-status ${statusCls}">${statusTxt}</div>`;
    row.onclick = () => { currentStreamIdx = i; playStream(i); };
    sg.appendChild(row);
  });

  // info bar quick buttons
  const ibs = document.getElementById('ibs');
  ibs.innerHTML = '';
  ch.streams.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'sq-btn' + (i === currentStreamIdx ? ' active' : '');
    b.textContent = s.quality || 'auto';
    b.onclick = () => { currentStreamIdx = i; playStream(i); };
    ibs.appendChild(b);
  });
}

// ═══════════════════ STREAM PLAYBACK ═══════════════════
function playStream(idx) {
  if (!currentCh) return;
  const streams = currentCh.streams;
  if (idx >= streams.length) {
    showOv('সব স্ট্রিম ব্যর্থ হয়েছে ❌', '');
    return;
  }
  currentStreamIdx = idx;

  // Update UI highlights
  document.querySelectorAll('.stream-row').forEach((r,i) => r.classList.toggle('playing', i===idx));
  document.querySelectorAll('.sq-btn').forEach((b,i) => b.classList.toggle('active', i===idx));

  const s = streams[idx];
  showOv('লোড হচ্ছে...', s.quality || '');

  const qb = document.getElementById('qb');
  qb.style.display = 'none';

  const v = document.getElementById('vp');
  v.style.display = 'block';

  if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
  clearTimeout(failTimer);

  // Auto-fail timer: if no manifest in 10s, try next
  failTimer = setTimeout(() => {
    console.log(`⏱ Timeout on stream ${idx}, trying next`);
    markFail(idx);
    playStream(idx + 1);
  }, 10000);

  const url = s.url;
  const isHLS = url.includes('.m3u8') || url.includes('/hls/') || url.includes('/live/');

  function onSuccess() {
    clearTimeout(failTimer);
    markOk(idx);
    hideOv();
    qb.textContent = s.quality || 'LIVE';
    qb.style.display = 'block';
    v.play().catch(() => {});
  }
  function onFail(reason) {
    clearTimeout(failTimer);
    console.log(`❌ Stream ${idx} failed: ${reason}, trying next`);
    markFail(idx);
    playStream(idx + 1);
  }

  if (Hls.isSupported() && isHLS) {
    hlsInst = new Hls({ maxBufferLength: 15, maxMaxBufferLength: 30, manifestLoadingTimeOut: 8000, levelLoadingTimeOut: 8000 });
    hlsInst.loadSource(url);
    hlsInst.attachMedia(v);
    hlsInst.on(Hls.Events.MANIFEST_PARSED, onSuccess);
    hlsInst.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) onFail(d.type); });
  } else if (v.canPlayType('application/vnd.apple.mpegurl') && isHLS) {
    v.src = url;
    v.onloadedmetadata = onSuccess;
    v.onerror = () => onFail('native error');
  } else {
    v.src = url;
    v.onloadeddata = onSuccess;
    v.onerror = () => onFail('native error');
    v.load();
  }
}

function markOk(idx) {
  if (!currentCh) return;
  currentCh.streams[idx].status = 'ok';
  const row = document.getElementById('sr-'+idx);
  if (row) row.querySelector('.sr-status').className = 'sr-status ok';
  row && (row.querySelector('.sr-status').textContent = 'সক্রিয়');
}
function markFail(idx) {
  if (!currentCh) return;
  currentCh.streams[idx].status = 'fail';
  const row = document.getElementById('sr-'+idx);
  if (row) { row.querySelector('.sr-status').className = 'sr-status fail'; row.querySelector('.sr-status').textContent = 'ব্যর্থ'; }
}

function showOv(msg, src) {
  const ov = document.getElementById('ov');
  ov.classList.add('show');
  document.getElementById('om').textContent = msg;
  document.getElementById('os').textContent = src ? src.toUpperCase() : '';
}
function hideOv() { document.getElementById('ov').classList.remove('show'); }

// ═══════════════════ START ═══════════════════
loadAll();
</script>
</body>
